<!-- Start Bot -->

  <!-- Minimized Button -->
  <button id="chat-toggle" type="button" aria-label="Open chat" aria-expanded="false" aria-controls="chat-container">💬</button>

  <!-- Chat window. The chat is the page /chat/ (see chat/index.html), loaded the first time the window opens. -->
  <div id="chat-container" role="dialog" aria-label="Sujeeth Foundation chat">
    <iframe id="chat-frame" title="Sujeeth Foundation chat"></iframe>
  </div>


<script>
(function () {
  "use strict";

  var CHAT_URL = "https://www.sujeeth.org/chat";
  var toggle = document.getElementById("chat-toggle");
  var container = document.getElementById("chat-container");
  var frame = document.getElementById("chat-frame");

  if (!toggle || !container || !frame) {
    console.error("Chat embed could not initialize: required elements are missing.");
    return;
  }

  var originalParent = container.parentNode;
  var originalNextSibling = container.nextSibling;
  var isOpen = false;
  var savedScrollY = 0;
  var savedBodyStyles = null;
  var savedHtmlOverflow = "";
  var visualViewport = window.visualViewport;
  var virtualKeyboard = navigator.virtualKeyboard || null;
  var previousKeyboardOverlayMode = null;
  var isMobile = window.matchMedia("(max-width: 480px)");

  function lockBackgroundScroll() {
    savedScrollY = window.scrollY || window.pageYOffset;
    savedBodyStyles = {
      overflow: document.body.style.overflow
    };
    savedHtmlOverflow = document.documentElement.style.overflow;

    // Do not set body to position:fixed. On Android this can change the
    // containing block used by the fixed chat overlay and leave it ending
    // above the keyboard. Lock scrolling with overflow instead.
    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";
  }

  function unlockBackgroundScroll() {
    if (!savedBodyStyles) return;

    document.documentElement.style.overflow = savedHtmlOverflow;
    document.body.style.overflow = savedBodyStyles.overflow;

    window.scrollTo(0, savedScrollY);
    savedBodyStyles = null;
  }

  function syncChatViewport() {
    if (!isOpen) return;

    container.style.position = "fixed";
    container.style.zIndex = "2147483647";

    if (isMobile.matches) {
      var topInset = 0;
      var bottomInset = 0;

      // Preferred path: use the standard Virtual Keyboard API when the
      // browser supports it. The API is controlled by the top-level page,
      // even though the focused message field lives inside the chat iframe.
      if (virtualKeyboard && virtualKeyboard.overlaysContent) {
        var keyboardRect = virtualKeyboard.boundingRect;
        if (keyboardRect && keyboardRect.height > 0) {
          bottomInset = Math.max(0, window.innerHeight - keyboardRect.top);
        }
      } else if (visualViewport) {
        // Cross-browser fallback: fit the shell to the top-level visual
        // viewport. This works when the browser resizes the visual viewport
        // for its on-screen keyboard instead of exposing VirtualKeyboard.
        topInset = Math.max(0, visualViewport.offsetTop);
        bottomInset = Math.max(
          0,
          window.innerHeight - visualViewport.height - topInset
        );
      }

      container.style.left = "0";
      container.style.right = "0";
      container.style.top = topInset + "px";
      container.style.bottom = bottomInset + "px";
      container.style.width = "100vw";
      container.style.height = "auto";
      container.style.maxHeight = "none";
      container.style.borderRadius = "0";
    } else {
      container.style.left = "auto";
      container.style.right = "20px";
      container.style.top = "auto";
      container.style.bottom = "92px";
      container.style.width = "min(400px, calc(100vw - 32px))";
      container.style.height = "min(600px, calc(100vh - 168px))";
      container.style.maxHeight = "";
      container.style.borderRadius = "12px";
    }
  }

  function resetChatViewport() {
    container.style.position = "";
    container.style.zIndex = "";
    container.style.left = "";
    container.style.right = "";
    container.style.top = "";
    container.style.bottom = "";
    container.style.width = "";
    container.style.height = "";
    container.style.maxHeight = "";
    container.style.borderRadius = "";
  }

  function restoreContainer() {
    if (originalParent && container.parentNode !== originalParent) {
      if (originalNextSibling && originalNextSibling.parentNode === originalParent) {
        originalParent.insertBefore(container, originalNextSibling);
      } else {
        originalParent.appendChild(container);
      }
    }
  }

  function setChat(open) {
    if (isOpen === open) return;
    isOpen = open;

    if (isOpen) {
      // Move out of ancestor stacking contexts so the overlay can cover navigation.
      document.body.appendChild(container);
      document.documentElement.classList.add("chat-open");
      lockBackgroundScroll();

      // Let the page own keyboard layout only when the API is available.
      // Restore the previous setting when the chat closes.
      if (isMobile.matches && virtualKeyboard) {
        previousKeyboardOverlayMode = virtualKeyboard.overlaysContent;
        virtualKeyboard.overlaysContent = true;
      }

      container.style.display = "flex";

      if (!frame.getAttribute("src")) {
        frame.setAttribute("src", CHAT_URL);
      }
      syncChatViewport();
    } else {
      container.style.display = "none";
      resetChatViewport();
      restoreContainer();

      if (virtualKeyboard && previousKeyboardOverlayMode !== null) {
        virtualKeyboard.overlaysContent = previousKeyboardOverlayMode;
        previousKeyboardOverlayMode = null;
      }

      unlockBackgroundScroll();
      document.documentElement.classList.remove("chat-open");
    }

    toggle.setAttribute("aria-expanded", String(isOpen));
    toggle.setAttribute("aria-label", isOpen ? "Close chat" : "Open chat");
  }

  toggle.addEventListener("click", function () {
    setChat(!isOpen);
  });

  window.addEventListener("resize", syncChatViewport);
  if (visualViewport) {
    visualViewport.addEventListener("resize", syncChatViewport);
    visualViewport.addEventListener("scroll", syncChatViewport);
  }
  if (virtualKeyboard) {
    virtualKeyboard.addEventListener("geometrychange", syncChatViewport);
  }

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && isOpen) {
      setChat(false);
      toggle.focus();
    }
  });

  window.addEventListener("message", function (event) {
    if (
      event.source === frame.contentWindow &&
      event.data &&
      event.data.type === "sujeeth-chat-close"
    ) {
      setChat(false);
      toggle.focus();
    }
  });
})();
</script>
<!-- End Bot -->
