<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="robots" content="noindex">
  <title>Ask the Foundation</title>
  <link rel="preconnect" href="https://sujeethchat-bwbrhgb9f2gbhubt.centralus-01.azurewebsites.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/sujeeth-chat.css">
  <script defer src="/js/foundry-chat-connection.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <img src="/img/chat-avatar.png" alt="" width="32" height="32">
      <span class="title">Ask the Foundation</span>
      <button type="button" class="icon-button" id="restart" aria-label="Start a new conversation" title="Start a new conversation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      </button>
      <button type="button" class="icon-button" id="close" aria-label="Close chat" title="Close chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </header>

    <main id="transcript" role="log" aria-live="polite" aria-relevant="additions text"></main>

    <div class="composer-wrap">
      <div id="pending-files" class="pending-files" aria-live="polite"></div>
      <form id="composer" class="composer">
        <input id="file-input" type="file" multiple hidden
          accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.md,.csv,.docx,.pptx,.xlsx">
        <button type="button" id="attach" class="attach-button" aria-label="Attach files" title="Attach files">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-8.5 8.5a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg>
        </button>
        <textarea id="message" rows="1" maxlength="2000" placeholder="Ask a question..." aria-label="Your message"></textarea>
        <button type="submit" id="send" class="send-button" aria-label="Send message" title="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
        </button>
      </form>
      <p class="composer-note">You can attach PDF, Word, PowerPoint, Excel, text, CSV, and image files. Do not share sensitive personal information.</p>
    </div>
  </div>
</body>
</html>
